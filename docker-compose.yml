services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ufeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ufeed}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ufeed} -d ${POSTGRES_DB:-ufeed}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Localhost-only, for debugging. The app reaches Postgres over the compose
      # network; set DB_HOST_PORT to avoid collisions (or it can be dropped).
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # Run migrations, then serve. Dev mode uses --reload.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      # Localhost-only, for debugging; prod traffic goes through the proxy.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    # The backend applies migrations; the worker just runs the ingestion loop.
    command: ["python", "-m", "app.workers.run"]
    # The worker serves no HTTP, so the image's HTTP healthcheck never applies.
    healthcheck:
      disable: true
    volumes:
      - ./backend:/app

  ai:
    build: ./AI
    restart: unless-stopped
    env_file: .env
    # AI_BACKEND=hashing (portable, default) | openvino (Intel iGPU/NPU on NAS).
    # For OpenVINO on the NAS, pass devices: /dev/dri (iGPU) and /dev/accel (NPU).
    # devices:
    #   - /dev/dri:/dev/dri
    #   - /dev/accel:/dev/accel

  frontend:
    build: ./Frontend
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # UFEED_DOMAIN (optional) enables automatic HTTPS for that hostname.
    env_file: .env
    depends_on:
      - backend
      - frontend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # Behind an external TLS proxy (e.g. Cosmos on the QNAP), leave
      # UFEED_DOMAIN unset and point it at http://<beelink-ip>:${UFEED_HTTP_PORT}.
      - "${UFEED_HTTP_PORT:-80}:80"
      # Behind an external TLS proxy set UFEED_HTTPS_BIND=127.0.0.1 so the
      # (unused) HTTPS port isn't exposed on the network.
      - "${UFEED_HTTPS_BIND:-0.0.0.0}:${UFEED_HTTPS_PORT:-443}:443"

volumes:
  pgdata:
  redis-data:
  caddy-data:
  caddy-config:
