name: ufeed
description: "uFeed: lector RSS nativo (cliente de la API de ufeed.uverse.es)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.25.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.7
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6
  flutter_cache_manager: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Built from images/ufeed logo 1.png by scripts/make_icons.py.
flutter_launcher_icons:
  image_path: "assets/icon/ufeed_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter:
  # Flutter 3.38.5's Swift Package Manager integration breaks on this Xcode
  # (same as AuraBox), so plugins come through CocoaPods for now.
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/ufeed_icon.png

  # Atkinson Hyperlegible (Braille Institute, OFL: assets/fonts/OFL.txt), the
  # reader's accessibility font, as in the web app.
  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic
