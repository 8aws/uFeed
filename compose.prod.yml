# Production overrides (safe on any host).
# Usage (HTTP behind an external TLS proxy such as Cosmos on the QNAP):
#   cp .env.prod.example .env   # edit secrets; leave UFEED_DOMAIN unset
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d --build
# To enable Intel iGPU/NPU inference, add: -f compose.openvino.yml
services:
  backend:
    # No --reload in production; a few workers for the API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips='*' --no-server-header"
    # --forwarded-allow-ips='*' is safe here: the backend is only reachable via
    # the internal network (proxy) and 127.0.0.1; Caddy sets X-Forwarded-For
    # from the client IP it trusts (see proxy/Caddyfile trusted_proxies).
    volumes:
      # Read-only view of backup status (backups/status.json) for the admin panel.
      - ./backups:/backups:ro
    # Non-root (see backend/Dockerfile) and no way to regain privileges.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  worker:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
