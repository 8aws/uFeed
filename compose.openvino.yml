# Enable OpenVINO inference on Intel iGPU/NPU (Beelink Core Ultra).
# Requires the Intel compute runtime (/dev/dri) and, for NPU, /dev/accel.
# Usage:
#   docker compose -f docker-compose.yml -f compose.prod.yml -f compose.openvino.yml up -d --build
# and set AI_BACKEND=openvino in .env.
services:
  ai:
    build:
      context: ./AI
      args:
        # Pulls OpenVINO + optimum-intel + transformers for on-device inference.
        AI_EXTRAS: "[openvino,tts,mt]"
    environment:
      AI_BACKEND: openvino
      AI_MODEL: ${AI_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      OPENVINO_DEVICE: ${OPENVINO_DEVICE:-AUTO}
      # On-device LLM for AI summaries/translation (empty = disabled).
      AI_LLM_MODEL: ${AI_LLM_MODEL:-OpenVINO/Qwen3-4B-int4-ov}
      AI_LLM_DEVICE: ${AI_LLM_DEVICE:-GPU}
      AI_MODELS_DIR: /models
      # Server voice for "listen" (Piper, CPU). Empty = disabled.
      AI_TTS_VOICES: ${AI_TTS_VOICES:-es:m=es_ES-davefx-medium,es:f=es_ES-sharvard-medium@F,en:f=en_US-lessac-medium,en:m=en_US-ryan-medium}
      AI_TTS_THREADS: ${AI_TTS_THREADS:-3}
      # Translation pairs for "read in my language" (export: scripts/export_mt.sh).
      AI_MT_PAIRS: ${AI_MT_PAIRS:-en-es,es-en}
      AI_MT_DEVICE: ${AI_MT_DEVICE:-CPU}
    volumes:
      # Downloaded LLMs (~2.5 GB for Qwen3-4B int4) and Piper voices (~60 MB each).
      - ai-models:/models
    devices:
      - /dev/dri:/dev/dri                    # iGPU
    # The NPU node is added by compose.npu.yml (only where it exists).
    group_add:
      # The container must be in the host groups that own /dev/dri (and
      # /dev/accel). Group *names* resolve inside the container and may not
      # match the host, so set the host's numeric gids in .env:
      #   GPU_VIDEO_GID=$(getent group video | cut -d: -f3)
      #   GPU_RENDER_GID=$(stat -c %g /dev/dri/renderD128)
      - "${GPU_VIDEO_GID:-video}"
      - "${GPU_RENDER_GID:-render}"

volumes:
  ai-models:
