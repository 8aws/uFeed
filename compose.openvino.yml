# Enable OpenVINO inference on Intel iGPU/NPU (Beelink Core Ultra).
# Requires the Intel compute runtime (/dev/dri) and, for NPU, /dev/accel.
# Usage:
#   docker compose -f docker-compose.yml -f compose.prod.yml -f compose.openvino.yml up -d --build
# and set AI_BACKEND=openvino in .env.
services:
  ai:
    build:
      context: ./AI
      args:
        # Pulls OpenVINO + optimum-intel + transformers for on-device inference.
        AI_EXTRAS: "[openvino]"
    environment:
      AI_BACKEND: openvino
      AI_MODEL: ${AI_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      OPENVINO_DEVICE: ${OPENVINO_DEVICE:-AUTO}
    devices:
      - /dev/dri:/dev/dri
      # Uncomment on Core Ultra with an NPU driver:
      # - /dev/accel:/dev/accel
    group_add:
      - video
      - render
