# Enable OpenVINO inference on Intel iGPU/NPU (Beelink Core Ultra).
# Requires the Intel compute runtime (/dev/dri) and, for NPU, /dev/accel.
# Usage:
#   docker compose -f docker-compose.yml -f compose.prod.yml -f compose.openvino.yml up -d --build
# and set AI_BACKEND=openvino in .env.
services:
  ai:
    build:
      context: ./AI
      args:
        # Pulls OpenVINO + optimum-intel + transformers for on-device inference.
        AI_EXTRAS: "[openvino]"
    environment:
      AI_BACKEND: openvino
      AI_MODEL: ${AI_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      OPENVINO_DEVICE: ${OPENVINO_DEVICE:-AUTO}
    devices:
      - /dev/dri:/dev/dri                    # iGPU
      # NPU (Core Ultra): uncomment once Intel's NPU driver is installed on the
      # host and the node exists (ls /dev/accel/accel0). Passing a missing node
      # makes the container fail to start, so keep it commented until verified.
      # - /dev/accel/accel0:/dev/accel/accel0
    group_add:
      # Container must be in the host groups that own the device nodes. The names
      # 'video'/'render' resolve to the CONTAINER's GIDs, which may not match the
      # host's — if you get permission errors on /dev/dri or /dev/accel, replace
      # these with the host's NUMERIC gids, e.g.:
      #   getent group render  -> render:x:993:...   -> add "993"
      #   stat -c '%g' /dev/dri/renderD128           -> that gid
      - video
      - render
