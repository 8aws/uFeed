[project]
name = "ufeed-backend"
version = "0.1.0"
description = "uFeed backend — FastAPI API (internal + public) and ingestion worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # Brought forward for WS1 (auth) / WS2 (ingestion) so branches don't each edit deps.
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "apscheduler>=3.10",
    "redis>=5.2",
    "pgvector>=0.3.6",
    # Full article text for feeds that only publish an excerpt.
    "trafilatura>=2.0",
    # Feed icons (often .ico) as small PNGs inside digest emails.
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.16,<0.17",  # pinned: new ruff/black releases can fail CI unexpectedly
    "black>=26.5,<27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
