<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png?v=2" sizes="32x32" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#e8551f" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
		<style>
			/* Boot splash: painted before any JS loads so a cold start never shows
			   a blank screen. The app removes it once the interface is ready. */
			#boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.1rem;
				background: #f7f7f8;
				color: #6b7280;
				font: 14px system-ui, -apple-system, sans-serif;
				transition: opacity 0.25s;
			}
			#boot img {
				width: 84px;
				height: 84px;
				border-radius: 20px;
			}
			#boot .bar {
				width: 120px;
				height: 3px;
				border-radius: 3px;
				background: rgba(107, 114, 128, 0.2);
				overflow: hidden;
			}
			#boot .bar::after {
				content: '';
				display: block;
				width: 40%;
				height: 100%;
				background: #e8551f;
				border-radius: 3px;
				animation: boot-slide 1.1s ease-in-out infinite;
			}
			#boot a {
				color: #e8551f;
				opacity: 0;
				animation: boot-show 0.3s 12s forwards; /* only if boot stalls */
			}
			#boot.gone {
				opacity: 0;
				pointer-events: none;
			}
			@keyframes boot-slide {
				from { transform: translateX(-100%); }
				to { transform: translateX(250%); }
			}
			@keyframes boot-show {
				to { opacity: 1; }
			}
			@media (prefers-color-scheme: dark) {
				#boot {
					background: #0f172a;
					color: #9ca3af;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" aria-busy="true">
			<img src="%sveltekit.assets%/icon-192.png?v=2" alt="uFeed" />
			<div class="bar"></div>
			<a href="/">↻</a>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
