[project]
name = "ufeed-ai"
version = "0.1.0"
description = "uFeed AI service — embeddings/summaries behind a stable HTTP API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

# OpenVINO backend for the NAS (Intel iGPU/NPU). Not installed by default so the
# image builds anywhere; enable on the NAS:
#   pip install ".[openvino]"
# Wildcat Lake / Core Series 3 needs OpenVINO 2026.2+ (older releases lack the
# GPU/NPU plugin support for the new device IDs). See AI/intel-debs/README.md.
[project.optional-dependencies]
openvino = [
    "openvino>=2026.2",
    "openvino-genai>=2026.2",  # on-device LLM (summaries/translation)
    "optimum-intel>=1.25",
    "transformers>=4.44",
]

# Server-side text-to-speech (Piper neural voices, CPU). Enabled on the NAS:
#   pip install ".[openvino,tts]"  and set AI_TTS_VOICES.
tts = [
    "piper-tts>=1.3",
    "lameenc>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
